<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20182c"><title>Toga • After School</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff4fa;background:#1c1626}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 10%,#5b365d 0%,#271d34 48%,#16131e 100%);min-height:100dvh}.app{max-width:540px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 19px 10px;z-index:3}.brand{font-size:19px;font-weight:850;letter-spacing:.2px}.sub{font-size:11px;color:#dfb9ce;margin-top:3px}.heart{font-size:12px;background:#493048;border:1px solid #8c567a;border-radius:99px;padding:9px 12px;color:#ffe3ef}.scene{height:min(49dvh,420px);min-height:280px;position:relative;display:grid;place-items:center;overflow:hidden}.halo{position:absolute;width:290px;height:290px;border-radius:50%;background:#ffbadc33;filter:blur(35px);top:40px}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 2px);background-size:54px 61px;opacity:.25}.portrait{position:absolute;height:100%;width:auto;max-width:94%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 18px #100d20bb);transition:opacity .5s,transform .5s;mix-blend-mode:lighten;mask-image:linear-gradient(to bottom,black 0%,black 84%,transparent 100%)}.portrait.off{opacity:0;transform:translateY(10px) scale(.97)}.portrait.on{opacity:1;transform:translateY(0) scale(1)}.name{position:absolute;bottom:10px;left:18px;background:#261b32d9;border:1px solid #a8689b;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:800}.panel{position:relative;z-index:2;margin:-4px 12px 12px;background:#30263ddf;border:1px solid #76526f;border-radius:22px;padding:17px;box-shadow:0 12px 40px #08060c77;backdrop-filter:blur(14px);flex:1;display:flex;flex-direction:column;gap:12px;min-height:265px}.dialog{min-height:76px;font-size:16px;line-height:1.5}.small{font-size:12px;color:#d4a9c4}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.tabs button{white-space:nowrap}.tabs button,.choices button,.action{border:1px solid #815b80;background:#46344f;color:#fff0f8;border-radius:13px;padding:11px 12px;font:inherit;cursor:pointer}.tabs button.selected{background:#b34f86;border-color:#ee98c3}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{text-align:left;font-size:13px;min-height:50px}.choices button:active,.action:active{transform:scale(.98)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.action{background:#c15d92;border-color:#f5a9cd;font-weight:750}.meter{height:7px;background:#5d425f;border-radius:10px;overflow:hidden;margin-top:5px}.fill{height:100%;width:20%;background:linear-gradient(90deg,#f88abc,#ffd0e2);transition:width .35s}.foot{text-align:center;color:#b795af;font-size:10px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}button:focus-visible{outline:3px solid #ffd2eb;outline-offset:2px}@media(max-height:700px){.scene{height:37dvh;min-height:215px}.panel{padding:13px;gap:8px}.dialog{min-height:56px;font-size:14px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">♡ Toga After School</div><div class="sub">A little companion hangout</div></div><div class="heart" id="hearts">♥ 10 friendship</div></header><section class="scene" aria-label="Illustrated character"><div class="halo"></div><div class="stars"></div><img id="pose0" class="portrait on" src="pose_excited.png" alt="Toga leaning forward excitedly"><img id="pose1" class="portrait off" src="pose_playful.png" alt="Toga standing playfully and gesturing"><div class="name">Himiko Toga ✦</div></section><section class="panel"><div class="small" id="mood">✦ Mood: Curious</div><div class="dialog" id="dialog" aria-live="polite">Heeey! You're here! So, what should we talk about today?</div><nav class="tabs" id="tabs" aria-label="Conversation categories"></nav><div class="choices" id="choices"></div><div class="bottom"><div style="flex:1"><div class="small">Friendship level <span id="level">1</span></div><div class="meter"><div class="fill" id="fill"></div></div></div><button class="action" id="surprise">✧ Surprise me</button></div></section><div class="foot">Fan-made, offline, single-player • Progress saves on this device</div></main><script>
const topics={
'💬 Chat':[['How was your day?','Mmm, a little boring until now! Tell me something interesting!'],['What makes you happy?','Little surprises, silly jokes, and people who let me be myself!'],['Tell me a secret','Okay, tiny secret: I rehearse dramatic entrances when nobody is watching. Shhh!'],['What are you thinking?','I was wondering if clouds ever get tired of floating. Weird thought, huh?']],
'🎒 School':[['Favorite class?','Art! You can make the page look however you want.'],['Homework help?','I can cheer you on! Start with the easiest question, then take a tiny break.'],['Lunch break?','Ooh! Let’s pretend we have the best lunch table in the whole school.'],['After school plans?','A walk, snacks, and a very important mission: finding cute things!']],
'🎨 Activities':[['Draw together','Let’s draw matching little monsters! Mine has big eyes and tiny fangs.'],['Play guessing game','I’m thinking of something fluffy, round, and often in the sky... a cloud!'],['Make up a story','Once upon a time, a mysterious girl found a magical key in a candy shop...'],['Pick a playlist','Today’s vibe: bouncy, chaotic, and full of energy!']],
'✨ Favorites':[['Favorite snack?','Strawberry sweets! They look adorable, too.'],['Favorite weather?','Cloudy afternoons. Everything feels like a secret adventure.'],['Favorite color?','Pink and red! Bright colors have so much personality.'],['Cats or dogs?','Both! But imagine a cat that acts like a dramatic villain. Perfect.']],
'🌙 Feelings':[['I feel happy','Yay! Tell me the best part. I want to hear it!'],['I feel stressed','Then let’s do one small thing at a time. You don’t have to solve everything today.'],['I feel bored','Emergency fun time! Choose an activity and we’ll make it ridiculous.'],['I need encouragement','You’ve made it through tricky days before. One little step counts!']]
};
const moods=['Curious','Playful','Excited','Cheerful','Thoughtful'];let friendship=Math.max(0,Math.min(100,Number(localStorage.getItem('togaFriendship')||10))),current='💬 Chat',pose=0,last=-1;const $=id=>document.getElementById(id);function show(text,bonus=1){$('dialog').textContent=text;friendship=Math.min(100,friendship+bonus);localStorage.setItem('togaFriendship',friendship);$('hearts').textContent='♥ '+friendship+' friendship';$('fill').style.width=friendship+'%';$('level').textContent=Math.floor(friendship/20)+1;$('mood').textContent='✦ Mood: '+moods[Math.floor(Math.random()*moods.length)];setPose(1-pose)}function setPose(n){pose=n;for(let i=0;i<2;i++)$('pose'+i).className='portrait '+(i===pose?'on':'off')}function draw(){const tabs=$('tabs');tabs.innerHTML='';Object.keys(topics).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===current?'selected':'';b.onclick=()=>{current=t;draw();show(t==='🎨 Activities'?'Let’s do something fun together!':'Ooh, '+t.slice(2).toLowerCase()+'! Ask away!',0)};tabs.append(b)});const choices=$('choices');choices.innerHTML='';topics[current].forEach(([q,a])=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>show(a,2);choices.append(b)})}$('surprise').onclick=()=>{const keys=Object.keys(topics),t=keys[Math.floor(Math.random()*keys.length)],entry=topics[t][Math.floor(Math.random()*topics[t].length)];current=t;draw();show(entry[1],3)};draw();show('Heeey! You’re here! So, what should we talk about today?',0);setInterval(()=>{if(document.visibilityState==='visible')setPose(1-pose)},13000);
</script></body></html>
